services:
  backend:
    build:
      context: ./backend
    container_name: raidware-backend
    ports:
      - "9631:5000"
    restart: always
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
    container_name: raidware-frontend
    ports:
      - "9630:3000"
    restart: always
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
