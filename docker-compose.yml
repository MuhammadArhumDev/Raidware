services:
  backend:
    build:
      context: ./backend
    container_name: raidware-backend
    ports:
      - "9631:5000"
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - IDS_ENGINE_URL=http://raidware-ids:9632
    networks:
      - raidware-internal

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
    container_name: raidware-frontend
    ports:
      - "9630:3000"
    restart: always
    env_file:
      - ./frontend/.env
    environment:
      # Runtime URL for SSR server-side fetch (must NOT be localhost in Docker)
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
    depends_on:
      - backend
    networks:
      - raidware-internal

  ids-engine:
    build:
      context: ./ids-engine
      dockerfile: Dockerfile
    container_name: raidware-ids
    restart: unless-stopped
    volumes:
      - ./ids-engine/models:/app/models:ro
    environment:
      - MODEL_DIR=/app/models
    networks:
      - raidware-internal
    # No ports: block — internal only, not exposed to the internet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9632/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  raidware-internal:
    driver: bridge
